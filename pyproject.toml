[project]
name = "tokenfloats"
version = "1.0.0"
description = "Tray panel showing live token usage for six AI coding tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["tokens", "usage", "llm", "tray", "monitoring", "cost"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "pystray>=0.19",
    "pillow>=10.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/EphoReal/TokenFloatS"
Issues = "https://github.com/EphoReal/TokenFloatS/issues"

[tool.setuptools]
py-modules = ["tokenfloats", "collectors", "wineffects"]
